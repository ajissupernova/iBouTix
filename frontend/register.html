<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | iBouTix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/auth.css"><script src="js/auth.js" defer></script>
</head>
<body class="auth-page"><header class="auth-header"><a class="wordmark" href="index.html">iBou<span>Tix</span></a><nav aria-label="Navigasi akun"><a href="index.html">Kembali ke beranda</a></nav></header>
<main class="auth-layout"><section class="auth-aside"><p class="eyebrow">RUANG UNTUK RENCANA SERU</p><h1>Simpan acara yang ingin kamu datangi.</h1><p>Buat akun prototype untuk menjelajahi pengalaman pengguna iBouTix.</p></section>
<section class="auth-card"><p class="eyebrow">AKUN iBOUTIX</p><h2>Buat akun</h2><p class="form-intro">Pendaftaran publik membuat akun dengan role user.</p>
<form data-auth-form="register" novalidate>
<label for="name">Nama lengkap</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Nama kamu" required>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Minimal 8 karakter" required>
<label for="confirm-password">Konfirmasi password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Ulangi password" required>
<button class="button auth-submit" type="submit">Register</button><p class="form-feedback" role="status" aria-live="polite"></p>
</form><p class="auth-switch">Sudah punya akun? <a href="login.html">Login</a></p></section></main>
<footer class="auth-footer">iBouTix · Prototype akademik</footer></body></html>
