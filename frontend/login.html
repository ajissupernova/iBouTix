<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | iBouTix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/auth.css"><script src="js/auth.js" defer></script>
</head>
<body class="auth-page"><header class="auth-header"><a class="wordmark" href="index.html">iBou<span>Tix</span></a><nav aria-label="Navigasi akun"><a href="index.html">Kembali ke beranda</a></nav></header>
<main class="auth-layout"><section class="auth-aside"><p class="eyebrow">MULAI DARI SINI</p><h1>Acara berikutnya sudah menunggu.</h1><p>Masuk untuk melihat prototype area pengguna iBouTix.</p></section>
<section class="auth-card"><p class="eyebrow">AKUN iBOUTIX</p><h2>Login</h2><p class="form-intro">Gunakan form ini untuk mencoba tampilan. Autentikasi belum aktif.</p>
<form data-auth-form="login" novalidate>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required>
<div class="label-row"><label for="password">Password</label><button class="text-button" type="button" data-password-toggle aria-controls="password" aria-pressed="false">Tampilkan</button></div>
<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" placeholder="Minimal 8 karakter" required>
<button class="button auth-submit" type="submit">Login</button><p class="form-feedback" role="status" aria-live="polite"></p>
</form><p class="auth-switch">Belum punya akun? <a href="register.html">Daftar</a></p></section></main>
<footer class="auth-footer">iBouTix · Prototype akademik</footer></body></html>
